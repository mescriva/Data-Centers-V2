<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Centers — Circuit Configurations</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <!-- LOGIN OVERLAY  (oculto por defecto) -->
  <div class="login-overlay" id="loginOverlay" style="display:none;">

    <video class="login-bg-video" autoplay loop muted playsinline>
      <source src="./assets/renders/v1.mp4" type="video/mp4" />
    </video>
    <div class="login-scrim"></div>

    <div class="login-card" role="main" aria-label="Pantalla de acceso">

      <div class="login-logo-row">
        <img class="login-logo" src="./assets/logo-pe.svg" alt="Power Electronics" />
      </div>

      <h2 class="login-title">Data Centers</h2>
      <p class="login-subtitle">Circuit Configurations</p>

      <div>
        <p class="login-label">Introduce el PIN</p>
        <div class="pin-dots" id="pinDots" aria-live="polite">
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
        </div>
        <p class="login-error" id="loginError" aria-live="assertive"></p>
      </div>

      <div class="pin-keyboard" id="pinKeyboard">
        <button class="pin-key" data-digit="1">1</button>
        <button class="pin-key" data-digit="2">2</button>
        <button class="pin-key" data-digit="3">3</button>
        <button class="pin-key" data-digit="4">4</button>
        <button class="pin-key" data-digit="5">5</button>
        <button class="pin-key" data-digit="6">6</button>
        <button class="pin-key" data-digit="7">7</button>
        <button class="pin-key" data-digit="8">8</button>
        <button class="pin-key" data-digit="9">9</button>
        <button class="pin-key pin-key--empty" disabled></button>
        <button class="pin-key" data-digit="0">0</button>
        <button class="pin-key pin-key--clear" id="pinClear" title="Borrar">⌫</button>
      </div>

      <button class="login-btn" id="loginBtn" disabled>Acceder</button>

    </div>
  </div>


  <!-- APP PRINCIPAL -->
  <div class="app" id="appRoot" style="display:none;">

    <main class="main">

      <!-- SECCIÓN A — Panel lateral izquierdo -->
      <aside class="section-a" id="sectionA" aria-label="Información del modelo y equipos">
        <header class="a-header">
          <div class="a-title-row">
            <div>
              <h1 class="a-title">Data Centers</h1>
              <h1 class="a-title">Circuit Configurations</h1>
            </div>
            <img class="a-logo" src="./assets/logo-pe.svg" alt="Power Electronics" />
          </div>
          <div class="a-badge" id="aBadge"></div>
          <p class="a-text"  id="aText"></p>
          <p class="a-text"  id="aText2"></p>
        </header>
        <div class="a-body" id="aBody"></div>
      </aside>

      <!-- Columna derecha: render arriba, gráfica abajo -->
      <section class="right-col">

        <!-- SECCIÓN B — Render / vídeo -->
        <section class="section-b" id="sectionB" aria-label="Render del data center">
          <div class="render-wrap" id="renderWrap"></div>
        </section>

        <!-- SECCIÓN C — Gráfica HTML interactiva -->
        <section class="section-c" id="sectionC" aria-label="Gráfica del data center">

          <div class="graph-header">
            <span class="graph-label"  id="graphLabel"></span>
            <span class="graph-legend" id="graphLegend"></span>
          </div>

          <!--
            #graphWrap  : contenedor con overflow oculto/auto según zoom.
                          Doble clic aquí activa el zoom 2×.
            #graphHtml  : el <iframe> estático que carga el HTML de Plotly.
                          width/height se escalan con el zoom para permitir scroll.
            #graphReset : botón ✕ centrado arriba, visible sólo con zoom activo.
          -->
          <div class="graph-wrap" id="graphWrap">
            <iframe
              id="graphHtml"
              class="graph-frame"
              src=""
              frameborder="0"
              scrolling="no"
              allowfullscreen
            ></iframe>
            <button class="graph-zoom-reset" id="graphReset" title="Restablecer zoom">✕</button>
          </div>

        </section>
      </section>
    </main>

    <!-- SECCIÓN D — Selector de modelos (barra inferior) -->
    <nav class="section-d" id="sectionD" aria-label="Selector de modelo">
      <div class="model-nav" id="modelNav"></div>
    </nav>

  </div>


  <!-- BARRA DE SESIÓN — esquina superior derecha, sólo en modelos protegidos -->
  <div class="session-bar" id="sessionBar" style="display:none;">
    <button id="sessionLogout" title="Cerrar sesión">
      <span class="session-bar-label">Cerrar sesión</span>
      <span class="session-bar-icon">✕</span>
    </button>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="login.js"></script>

</body>
</html>
